<title>Contingência — Encontro de Líderes 2026</title>
<link rel="stylesheet" href="css/estilo.css">
<style>
  body.projecao { overflow: auto; }
  .cont-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 3vw; background: #fff; border-top: 2px solid var(--tinta); font-size: 16px; position: sticky; bottom: 0; }
  .cont-barra .botao { min-height: 44px; padding: 6px 14px; }
  .tela.cont { height: auto; min-height: calc(100vh - 62px); }
  .manual { font-size: 17px; }
  .manual input[type=number] { width: 5.2em; min-height: 44px; padding: 6px 8px; text-align: right; }
  .manual input[type=text] { min-height: 44px; padding: 6px 10px; }
  @media print { .cont-barra { display: none; } }
</style>
</head>
